[project]
name = "ask-pomdp"
version = "0.1.0"
description = "Uncertainty-Gated Language Assistance for RL under Partial Observability"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "rich>=13.7",
  "stable-baselines3[extra]>=2.3.0",
  "gymnasium>=0.29",
  "minigrid>=2.3.0",
  "shimmy>=1.3.0",
  "torch",
  "transformers>=4.57.3",
  "accelerate>=1.12.0",
  "safetensors>=0.7.0",
  "sentencepiece>=0.2.1",
  "tabulate>=0.9.0",
  "optuna>=4.6.0",
  "wandb>=0.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
