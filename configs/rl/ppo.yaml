experiment:
  seed: 42

env:
  name: MiniGrid-FourRooms-v0
  max_steps: 500

policy:
  dropout_rate: 0.2
  net_arch:
    pi: [256, 256]
    vf: [256, 256]

training:
  total_timesteps: 5_000_000
  n_steps: 2048
  batch_size: 64
  learning_rate: 3.0e-4
  eval_freq: 20000
  n_eval_episodes: 50

device: auto
